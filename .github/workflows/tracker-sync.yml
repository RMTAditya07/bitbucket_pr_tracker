name: Build tracker sync (Jira → Static Interactives + INTERACTIVE_COMPLETION)

# For every interactive whose Build Drop date (Static Interactives) is today or later: rolls its Jira
# phase-task statuses up into Static Interactives' Status, and keeps INTERACTIVE_COMPLETION current.
on:
  schedule:
    - cron: '30 3-13 * * 1-5' # hourly, 09:00–19:00 IST, Mon–Fri (UTC; GitHub may delay a few minutes)
  workflow_dispatch:

# Same group as the PR sync: both write to the same Zoho document and share its OAuth refresh token
concurrency:
  group: pr-sync
  cancel-in-progress: false

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # --- secrets (Settings → Secrets and variables → Actions → Secrets)
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      BITBUCKET_ACCESS_TOKEN: ${{ secrets.BITBUCKET_ACCESS_TOKEN }}
      BITBUCKET_API_TOKEN: ${{ secrets.BITBUCKET_API_TOKEN }}
      BITBUCKET_CLIENT_SECRET: ${{ secrets.BITBUCKET_CLIENT_SECRET }}
      # --- plain config (Settings → Secrets and variables → Actions → Variables)
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
      JIRA_STORY_POINTS_FIELD: ${{ vars.JIRA_STORY_POINTS_FIELD }}
      TRACKER_BUILD_SOURCE_WORKSHEET: ${{ vars.TRACKER_BUILD_SOURCE_WORKSHEET }}
      TRACKER_COMPLETION_WORKSHEET: ${{ vars.TRACKER_COMPLETION_WORKSHEET }}
      ZOHO_CLIENT_ID: ${{ vars.ZOHO_CLIENT_ID }}
      ZOHO_ACCOUNTS_URL: ${{ vars.ZOHO_ACCOUNTS_URL }}
      ZOHO_SHEET_API_URL: ${{ vars.ZOHO_SHEET_API_URL }}
      ZOHO_SHEET_ID: ${{ vars.ZOHO_SHEET_ID }}
      ZOHO_WORKSHEET_NAME: ${{ vars.ZOHO_WORKSHEET_NAME }}
      ZOHO_MIN_REQUEST_INTERVAL_MS: ${{ vars.ZOHO_MIN_REQUEST_INTERVAL_MS }}
      # The shared config loader also validates the Bitbucket settings
      BITBUCKET_WORKSPACE: ${{ vars.BITBUCKET_WORKSPACE }}
      BITBUCKET_REPOSITORY: ${{ vars.BITBUCKET_REPOSITORY }}
      BITBUCKET_EMAIL: ${{ vars.BITBUCKET_EMAIL }}
      BITBUCKET_CLIENT_ID: ${{ vars.BITBUCKET_CLIENT_ID }}
      SHEET_TIMEZONE: ${{ vars.SHEET_TIMEZONE }}
      LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Refresh build tracker
        run: node dist/trackerSync.js
